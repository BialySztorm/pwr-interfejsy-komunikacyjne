# Model registry, label mappings, and evaluation weights for the sentiment/emotion
# benchmark. Keep model choices and label mappings here, not hardcoded in scripts.

models:
  herbert_sentiment:
    hf_id: "Voicelab/herbert-base-cased-sentiment"
    task: sentiment
    multilabel: false
    base_model: "allegro/herbert-base-cased"
    license: "CC BY 4.0"
    params: "~130M"
    label_mapping:
      negative: negative
      neutral: neutral
      positive: positive

  bardsai_sentiment:
    hf_id: "bardsai/twitter-sentiment-pl-base"
    task: sentiment
    multilabel: false
    base_model: "allegro/herbert-base-cased"
    license: "CC BY 4.0"
    params: "~130M"
    label_mapping:
      negative: negative
      neutral: neutral
      positive: positive

  horizon_sentiment:
    hf_id: "Horizon-Labs/multilingual-sentiment-small"
    task: sentiment
    multilabel: false
    base_model: "jhu-clsp/mmBERT-small"
    license: "Apache-2.0"
    params: "~141M"
    label_mapping:
      negative: negative
      neutral: neutral
      positive: positive

  emotion_roberta_pl6:
    hf_id: "visegradmedia-emotion/Emotion_RoBERTa_polish6"
    task: emotion
    multilabel: false
    base_model: "RoBERTa"
    license: "MIT"
    params: "~355M"
    # This model's own config.json has no named id2label (just LABEL_0..LABEL_5), unlike
    # what the model card's prose implies. The order below was confirmed empirically
    # (unambiguous example sentence per emotion -> argmax index), not read from the repo,
    # and happens to match the model card's documented order (anger, fear, disgust,
    # sadness, joy, none of them). Re-verify if the model is ever updated.
    label_mapping:
      LABEL_0: anger
      LABEL_1: fear
      # Merged into "anger" by project decision -- see README "Label mapping decisions".
      LABEL_2: anger  # disgust
      LABEL_3: sadness
      LABEL_4: joy
      LABEL_5: none  # "none of them"

  goemotions_pl_gpt2:
    hf_id: "nie3e/go-emotions-polish-gpt2-small-v0.0.1"
    task: emotion
    multilabel: true
    multilabel_threshold: 0.5
    base_model: "sdadas/polish-gpt2-small"
    license: "MIT"
    params: "~124M"
    label_mapping:
      joy: joy
      amusement: joy
      excitement: joy
      love: joy
      admiration: joy
      approval: joy
      caring: joy
      desire: joy
      gratitude: joy
      optimism: joy
      pride: joy
      relief: joy
      sadness: sadness
      grief: sadness
      remorse: sadness
      disappointment: sadness
      embarrassment: sadness
      anger: anger
      annoyance: anger
      disapproval: anger
      disgust: anger
      fear: fear
      nervousness: fear
      neutral: none
      confusion: none
      curiosity: none
      surprise: none
      realization: none

  tabularisai_multilingual:
    hf_id: "tabularisai/multilingual-emotion-classification"
    task: emotion
    multilabel: true
    multilabel_threshold: 0.5
    base_model: "FacebookAI/xlm-roberta-base"
    license: "MIT"
    params: "~278M"
    label_mapping:
      joy: joy
      love: joy
      gratitude: joy
      sadness: sadness
      anger: anger
      contempt: anger
      disgust: anger
      frustration: anger
      fear: fear
      neutral: none
      surprise: none

# Unified label spaces every model's raw output is mapped into (see each model's
# label_mapping above). Irony is intentionally not an emotion-space label: no candidate
# model recognizes it, so it is evaluated separately as a sentiment-only subset (see
# evaluation.irony_ref_sentiment and README "Irony handling").
sentiment_labels: [negative, neutral, positive]
emotion_labels: [joy, sadness, anger, fear, none]

evaluation:
  # A text at or below this word count is "short"; above it, "long" (criterion 3 subset).
  # Not specified by the brief (it only asks for "short and elaborate" utterances) -- 10
  # was picked by inspecting the actual dataset's length_words distribution (5-52 words,
  # median 17) to get a non-trivial split (15 short / 40 long on the 55-text set at the
  # time this was set), instead of the earlier default of 5 which only matched 1 text.
  short_utterance_max_words: 10

  # The reference sentiment normally expected for the irony subset (used only to report
  # how often models are fooled into predicting the opposite), not for supervised scoring.
  irony_ref_sentiment: negative

  # Criteria 1-9 from the exercise brief. The brief asks us to define our own measures.
  # Computed criteria (1, 2, 3, 4, 6, 9) are produced automatically by evaluate.py from
  # predictions + reference labels. Manual criteria (5, 7, 8) are scored 0-1 by hand in
  # manual_scores below, with a short justification each.
  #
  # This weighting is a PROPOSAL awaiting approval, not an official rubric -- revisit
  # before the final report if the group/instructor wants different weights.
  criteria_weights:
    correctness: 0.20                # 1. sentiment/emotion classification correctness
    per_emotion_effectiveness: 0.15  # 2. effectiveness per emotion category
    robustness: 0.15                 # 3. robustness to negation/irony/ambiguity
    reference_agreement: 0.10        # 4. agreement with the reference annotation
    label_coverage: 0.10             # 5. range of recognized emotions/categories
    single_vs_batch: 0.05            # 6. single-utterance vs. larger-set analysis support
    interpretability: 0.10           # 7. readability/interpretability of output
    integration: 0.10                # 8. ease of integration into a conversational UI
    speed: 0.05                      # 9. classification time
  # Weights must sum to 1.0: 0.20+0.15+0.15+0.10+0.10+0.05+0.10+0.10+0.05 = 1.00

  # Manual 0-1 scores for criteria 5, 7, 8, filled in by hand once models have actually
  # been run (null = not scored yet). One short justification per score.
  manual_scores:
    label_coverage:
      herbert_sentiment: {score: 0.3, justification: "Only the 3 standard sentiment classes; no emotion granularity at all"}
      bardsai_sentiment: {score: 0.3, justification: "Same 3-class sentiment-only output as herbert_sentiment"}
      horizon_sentiment: {score: 0.3, justification: "Same 3-class sentiment-only output, no emotion categories"}
      emotion_roberta_pl6: {score: 0.6, justification: "6 raw classes (5 basic emotions + none), single-label only, no mixed-affect detection"}
      goemotions_pl_gpt2: {score: 0.95, justification: "28 raw multi-label GoEmotions categories, richest raw granularity, supports detecting mixed/simultaneous emotions"}
      tabularisai_multilingual: {score: 0.8, justification: "11 raw multi-label categories (incl. contempt, frustration, love, gratitude) plus multilingual support beyond Polish"}
    interpretability:
      herbert_sentiment: {score: 0.9, justification: "Clean named 3-class softmax output, trivial to read and log"}
      bardsai_sentiment: {score: 0.9, justification: "Same simple named 3-class output"}
      horizon_sentiment: {score: 0.9, justification: "Same simple named 3-class output"}
      emotion_roberta_pl6: {score: 0.5, justification: "Raw output is unlabeled LABEL_0..LABEL_5 with no built-in semantics -- meaningless without our own hand-verified mapping in config.yaml (see comment there)"}
      goemotions_pl_gpt2: {score: 0.6, justification: "28 named multi-label scores are informative but too many to read at a glance without aggregation"}
      tabularisai_multilingual: {score: 0.75, justification: "11 named multi-label sigmoid scores, named and independent -- more readable than 28 labels, still more to parse than a single 3-class softmax"}
    integration:
      herbert_sentiment: {score: 0.8, justification: "Standard transformers pipeline, ~130M fits CPU real-time use, 3-class output maps directly to simple branching logic"}
      bardsai_sentiment: {score: 0.8, justification: "Same integration profile as herbert_sentiment"}
      horizon_sentiment: {score: 0.85, justification: "Smallest sentiment model here, Apache-2.0 (most permissive), ships a quantized ONNX/Transformers.js variant aimed at lightweight deployment"}
      emotion_roberta_pl6: {score: 0.5, justification: "Largest model of the six (~355M) and requires permanently maintaining our own LABEL_i mapping table to stay meaningful"}
      goemotions_pl_gpt2: {score: 0.55, justification: "Smallest/fastest emotion model (~124M), but multi-label plus a 28-to-5 label mapping adds integration complexity"}
      tabularisai_multilingual: {score: 0.7, justification: "Moderate size, MIT license, straightforward sigmoid-threshold API, multilingual if the interface ever needs more than Polish"}
